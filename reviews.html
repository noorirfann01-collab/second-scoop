<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reviews — Second Scoop</title>
<meta name="description" content="Real reviews from Second Scoop scoopers — warm gooey Scoopies, Chunkies and edible dough. See what people say and leave your own.">
<link rel="icon" href="assets/img/logo-mark.svg">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div id="ss-announcement"></div>
<div id="ss-header-slot"></div>

<div class="ss-page-head">
  <div class="wrap">
    <span class="eyebrow">Real Scoopers</span>
    <h2>What people say</h2>
    <p id="rev-sub"></p>
  </div>
</div>

<section class="ss-sec" style="padding-top:26px">
  <div class="wrap">
    <div id="rev-summary" class="ss-rev-summary"></div>
    <div class="ss-shop-toolbar" style="margin-top:18px">
      <div class="ss-filters" id="rev-filters"></div>
      <button class="ss-btn ss-btn--ghost" id="rev-toggle">✍️ Leave a review</button>
    </div>
    <div class="ss-review-form-wrap" id="rev-form" style="display:none;margin-bottom:20px"></div>
    <div class="ss-reviews" id="rev-grid"><p class="ss-seed">Loading reviews…</p></div>
  </div>
</section>

<div id="ss-footer-slot"></div>

<script src="assets/js/config/settings.js"></script>
<script src="assets/js/config/regions.js"></script>
<script src="assets/js/config/products.js"></script>
<script src="assets/js/config/vault.js"></script>
<script src="assets/js/config/content.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/reviews.js"></script>
<script src="assets/js/pages/reviews-page.js"></script>
</body>
</html>
